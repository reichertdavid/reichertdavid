<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img">
<defs>

<linearGradient id="neon-t" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff2e97"/>
  <stop offset="45%" stop-color="#7b5cff"/>
  <stop offset="100%" stop-color="#22e0ff"/>
</linearGradient>
<linearGradient id="sheenG-t" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ff6ec7" stop-opacity="0.13"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="glass-t" x1="0" y1="0" x2="0.4" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
  <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
</linearGradient>
<linearGradient id="edge-t" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff2e97" stop-opacity="0.55"/>
  <stop offset="50%" stop-color="#7b5cff" stop-opacity="0.20"/>
  <stop offset="100%" stop-color="#22e0ff" stop-opacity="0.55"/>
</linearGradient>
<linearGradient id="bgfill-t" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#05030e"/>
  <stop offset="100%" stop-color="#0b0720"/>
</linearGradient>
<radialGradient id="blobA-t"><stop offset="0%" stop-color="#ff2e97" stop-opacity="0.85"/><stop offset="100%" stop-color="#ff2e97" stop-opacity="0"/></radialGradient>
<radialGradient id="blobB-t"><stop offset="0%" stop-color="#22e0ff" stop-opacity="0.75"/><stop offset="100%" stop-color="#22e0ff" stop-opacity="0"/></radialGradient>
<radialGradient id="blobC-t"><stop offset="0%" stop-color="#7b5cff" stop-opacity="0.9"/><stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
<radialGradient id="blobD-t"><stop offset="0%" stop-color="#6ef7c1" stop-opacity="0.45"/><stop offset="100%" stop-color="#6ef7c1" stop-opacity="0"/></radialGradient>
<filter id="soft-t" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="52"/>
</filter>
<filter id="glow-t" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grain-t" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<pattern id="grid-t" width="44" height="44" patternUnits="userSpaceOnUse">
  <path d="M44 0H0V44" stroke="#eae6ff" stroke-opacity="0.045" stroke-width="1" fill="none"/>
</pattern>
<clipPath id="card-t"><rect x="6" y="6" width="1188" height="308" rx="26"/></clipPath>

</defs>
<style>
<![CDATA[

.b1,.b2,.b3,.b4 { transform-box: view-box; }
.b1 { animation: drift1 26s ease-in-out infinite alternate; }
.b2 { animation: drift2 31s ease-in-out infinite alternate; }
.b3 { animation: drift3 23s ease-in-out infinite alternate; }
.b4 { animation: drift4 37s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(170px,-40px) scale(1.25); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-190px,-70px) scale(0.85); } }
@keyframes drift3 { from { transform: translate(0,0) scale(0.9); } to { transform: translate(120px,90px) scale(1.2); } }
@keyframes drift4 { from { transform: translate(0,0) scale(1); } to { transform: translate(-140px,60px) scale(1.3); } }

.sheen { transform-box: view-box; animation: sheen 9s ease-in-out infinite; }
@keyframes sheen {
  0%,55% { transform: translateX(0) skewX(-14deg); }
  85%,100% { transform: translateX(1700px) skewX(-14deg); }
}

.bar { animation: draw 2.4s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.ping { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 70%,100% { transform: scale(3); opacity: 0; } }
.fade { opacity: 0; animation: fade 1s ease-out .9s forwards; }
@keyframes fade { to { opacity: 1; } }

]]>
</style>

<g clip-path="url(#card-t)">
  <rect x="6" y="6" width="1188" height="308" rx="26" fill="url(#bgfill-t)"/>
  
<g filter="url(#soft-t)" opacity="0.9">
  <circle class="b1" cx="216" cy="96" r="176" fill="url(#blobA-t)"/>
