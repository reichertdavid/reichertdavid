  <rect x="6" y="6" width="1188" height="408" rx="26" fill="#05030e" opacity="0.55"/>
  <rect x="6" y="6" width="1188" height="408" rx="26" fill="url(#grid-h)"/>
  <rect x="6" y="6" width="1188" height="408" rx="26" fill="url(#glass-h)"/>
  <rect x="6" y="6" width="1188" height="408" filter="url(#grain-h)" opacity="0.05"/>
  <rect class="sheen" x="-400" y="6" width="300" height="408" fill="url(#sheenG-h)"/>
</g>
