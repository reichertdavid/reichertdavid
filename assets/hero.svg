<g clip-path="url(#type1)"><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="400" fill="#eae6ff" text-anchor="start" textLength="550.8" lengthAdjust="spacing" opacity="0.92" class="tl1">11 years writing code · 9 years getting paid for it</text></g>
<g clip-path="url(#type2)"><text x="60" y="264" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="400" fill="#eae6ff" text-anchor="start" textLength="540.0" lengthAdjust="spacing" opacity="0.92" class="tl2">stack: whichever one the problem actually deserves</text></g>
