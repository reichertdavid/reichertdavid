<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img">
<defs>

<linearGradient id="neon-h" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff2e97"/>
  <stop offset="45%" stop-color="#7b5cff"/>
  <stop offset="100%" stop-color="#22e0ff"/>
</linearGradient>
<linearGradient id="sheenG-h" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ff6ec7" stop-opacity="0.13"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="glass-h" x1="0" y1="0" x2="0.4" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
  <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
</linearGradient>
<linearGradient id="edge-h" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff2e97" stop-opacity="0.55"/>
  <stop offset="50%" stop-color="#7b5cff" stop-opacity="0.20"/>
  <stop offset="100%" stop-color="#22e0ff" stop-opacity="0.55"/>
</linearGradient>
<linearGradient id="bgfill-h" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#05030e"/>
  <stop offset="100%" stop-color="#0b0720"/>
</linearGradient>
<radialGradient id="blobA-h"><stop offset="0%" stop-color="#ff2e97" stop-opacity="0.85"/><stop offset="100%" stop-color="#ff2e97" stop-opacity="0"/></radialGradient>
<radialGradient id="blobB-h"><stop offset="0%" stop-color="#22e0ff" stop-opacity="0.75"/><stop offset="100%" stop-color="#22e0ff" stop-opacity="0"/></radialGradient>
<radialGradient id="blobC-h"><stop offset="0%" stop-color="#7b5cff" stop-opacity="0.9"/><stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
<radialGradient id="blobD-h"><stop offset="0%" stop-color="#6ef7c1" stop-opacity="0.45"/><stop offset="100%" stop-color="#6ef7c1" stop-opacity="0"/></radialGradient>
<filter id="soft-h" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="52"/>
</filter>
<filter id="glow-h" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="grain-h" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
</filter>
<pattern id="grid-h" width="44" height="44" patternUnits="userSpaceOnUse">
  <path d="M44 0H0V44" stroke="#eae6ff" stroke-opacity="0.045" stroke-width="1" fill="none"/>
</pattern>
<clipPath id="card-h"><rect x="6" y="6" width="1188" height="408" rx="26"/></clipPath>

<linearGradient id="word-h" x1="0" y1="0" x2="1" y2="0.6">
  <stop offset="0%" stop-color="#ff6ec7"><animate attributeName="stop-color" values="#ff6ec7;#22e0ff;#7b5cff;#ff6ec7" dur="12s" repeatCount="indefinite"/></stop>
  <stop offset="50%" stop-color="#eae6ff"/>
  <stop offset="100%" stop-color="#22e0ff"><animate attributeName="stop-color" values="#22e0ff;#7b5cff;#ff6ec7;#22e0ff" dur="12s" repeatCount="indefinite"/></stop>
</linearGradient>
<clipPath id="type0"><rect class="rv0" x="60" y="244" width="626.4" height="30"/></clipPath><clipPath id="type1"><rect class="rv1" x="60" y="244" width="550.8" height="30"/></clipPath><clipPath id="type2"><rect class="rv2" x="60" y="244" width="540.0" height="30"/></clipPath>
</defs>
<style>
<![CDATA[

.b1,.b2,.b3,.b4 { transform-box: view-box; }
.b1 { animation: drift1 26s ease-in-out infinite alternate; }
.b2 { animation: drift2 31s ease-in-out infinite alternate; }
.b3 { animation: drift3 23s ease-in-out infinite alternate; }
.b4 { animation: drift4 37s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(170px,-40px) scale(1.25); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1.1); } to { transform: translate(-190px,-70px) scale(0.85); } }
@keyframes drift3 { from { transform: translate(0,0) scale(0.9); } to { transform: translate(120px,90px) scale(1.2); } }
@keyframes drift4 { from { transform: translate(0,0) scale(1); } to { transform: translate(-140px,60px) scale(1.3); } }

.sheen { transform-box: view-box; animation: sheen 9s ease-in-out infinite; }
@keyframes sheen {
  0%,55% { transform: translateX(0) skewX(-14deg); }
  85%,100% { transform: translateX(1700px) skewX(-14deg); }
}

.rv0,.rv1,.rv2 { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
                 animation: reveal 12s steps(48,end) infinite; }
.rv1 { animation-delay: 4s; }
.rv2 { animation-delay: 8s; }
@keyframes reveal { 0% { transform: scaleX(0); } 12.5%,33.33% { transform: scaleX(1); } 33.34%,100% { transform: scaleX(0); } }
.tl0,.tl1,.tl2 { opacity: 0; animation: peek 12s linear infinite; }
.tl1 { animation-delay: 4s; }
.tl2 { animation-delay: 8s; }
@keyframes peek { 0%,30% { opacity: .92; } 33.33%,100% { opacity: 0; } }
.caret { transform-box: view-box; animation: run 12s steps(48,end) infinite, blink .9s steps(2,end) infinite; }

@keyframes run {
  0% { transform: translateX(0); }
  12.5%,33.33% { transform: translateX(626.4px); }
  33.34% { transform: translateX(0); }
  45.83%,66.66% { transform: translateX(550.8px); }
  66.67% { transform: translateX(0); }
  79.16%,100% { transform: translateX(540.0px); }
}

@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.blink { animation: blink 1.8s ease-in-out infinite; }
.pulse { transform-box: view-box; animation: slide 7s cubic-bezier(.5,0,.5,1) infinite; }
@keyframes slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(644px); } }
.orb { transform-box: view-box; transform-origin: 985px 210px;
        animation-name: spin; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.core { transform-box: view-box; transform-origin: 985px 210px; animation: breathe 4.5s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.05); opacity: 1; } }
.fade-a,.fade-b,.fade-c,.pill { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
.fade-a { animation-delay: .1s; }
.fade-b { animation-delay: .35s; }
.fade-c { animation-delay: 1.35s; }
.pill  { transform-box: view-box; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

]]>
</style>

<g clip-path="url(#card-h)">
  <rect x="6" y="6" width="1188" height="408" rx="26" fill="url(#bgfill-h)"/>
  
<g filter="url(#soft-h)" opacity="0.9">
