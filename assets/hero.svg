<g class="fade-b"><text x="60" y="196" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#word-h)" letter-spacing="5" textLength="764" lengthAdjust="spacing" filter="url(#glow-h)">DAVID REICHERT</text></g>
