<g class="pill" style="animation-delay:1.09s"><rect x="366.8" y="312" width="191.2" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#7b5cff" stroke-opacity="0.45" stroke-width="1"/><circle cx="381.8" cy="333" r="3" fill="#7b5cff" filter="url(#glow-h)"/><text x="392.8" y="339" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#7b5cff" text-anchor="start" textLength="10.2" lengthAdjust="spacing">9</text><text x="411.0" y="338" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#9a93c7" text-anchor="start" textLength="135.0" lengthAdjust="spacing">years professional</text></g>
<g class="pill" style="animation-delay:1.21s"><rect x="570.0" y="312" width="153.7" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#ff6ec7" stroke-opacity="0.45" stroke-width="1"/><circle cx="585.0" cy="333" r="3" fill="#ff6ec7" filter="url(#glow-h)"/><text x="596.0" y="339" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#ff6ec7" text-anchor="start" textLength="10.2" lengthAdjust="spacing">∞</text><text x="614.2" y="338" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#9a93c7" text-anchor="start" textLength="97.5" lengthAdjust="spacing">still curious</text></g>
