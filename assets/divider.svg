<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="26" viewBox="0 0 1200 26" fill="none" role="img">
<defs>

<linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ff2e97" stop-opacity="0"/>
  <stop offset="25%" stop-color="#ff2e97" stop-opacity="0.55"/>
  <stop offset="50%" stop-color="#7b5cff" stop-opacity="0.75"/>
  <stop offset="75%" stop-color="#22e0ff" stop-opacity="0.55"/>
  <stop offset="100%" stop-color="#22e0ff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#22e0ff" stop-opacity="0"/>
  <stop offset="100%" stop-color="#22e0ff" stop-opacity="0.9"/>
</linearGradient>
<filter id="dg" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3"/>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>
<![CDATA[

.run { transform-box: view-box; animation: sweep 6s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes sweep { 0% { transform: translateX(-80px); opacity: 0; } 10%,90% { opacity: 1; }
                   100% { transform: translateX(1280px); opacity: 0; } }

]]>
</style>

<rect x="0" y="12" width="1200" height="2" fill="url(#dl)"/>
<g class="run">
  <circle cx="0" cy="13" r="3.5" fill="#22e0ff" filter="url(#dg)"/>
  <rect x="-70" y="12" width="70" height="2" fill="url(#tail)"/>
</g>
</svg>
