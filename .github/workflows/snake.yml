name: generate snake

on:
  schedule:
    - cron: "17 3 * * *"   # daily, a bit off the hour so the runner queue is short
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render the contribution snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2e97&color_dots=#0b0720,#2c1d52,#5b3fb0,#a05bff,#22e0ff
            dist/snake-light.svg?color_snake=#7b5cff&color_dots=#efeaff,#cfc2ff,#a58cff,#ff6ec7,#22e0ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
